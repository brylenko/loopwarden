name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Test suite
        run: npm test

      - name: Smoke tests
        run: |
          node smoke-test.mjs
          node smoke-test-core.mjs

      - name: Knip (dead code)
        if: matrix.node-version == '20.x'
        run: npx knip
